version: '3.8'

services:
  db:
    image: postgres:15
    container_name: soto-system-db
    restart: always
    environment:
      POSTGRES_USER: soto_user
      POSTGRES_PASSWORD: tu_password_aqui
      POSTGRES_DB: soto_db
    ports:
      - "5432:5432"
    volumes:
      # ESTA LÍNEA ES LA MAGIA: Vincula tu carpeta real con la de Docker
      - ./postgres_data:/var/lib/postgresql/data

networks:
  default:
    driver: bridge
